<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>말랑프렌즈 물감대소동</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game-shell">

      <!-- ══════════════════════════════════════
           대기 화면 — 방 코드 공유 & 캐릭터 선택
           ══════════════════════════════════════ -->
      <section id="lobbyScreen" class="screen is-active">
        <h1 class="game-title">🎨 물감대소동</h1>
        <p class="game-desc">60초 동안 바닥을 내 색으로 칠하세요!<br>가장 넓게 칠한 친구가 우승 🏆</p>

        <div class="room-code-box">
          <p class="room-code-label">친구에게 이 코드를 공유하세요</p>
          <div id="roomCode" class="room-code">⏳ 연결 중...</div>
          <p class="room-code-hint">같은 코드로 접속하면 같은 방에 합류됩니다</p>
        </div>

        <div class="setup-box">
          <input id="nameInput" class="name-input" type="text" maxlength="10" placeholder="별명 입력" autocomplete="off" />
          <div id="charPicker" class="char-picker"></div>
        </div>

        <div class="players-box">
          <p class="players-label">참가자</p>
          <ul id="playerList" class="player-list"></ul>
          <p id="ongoingHint" class="ongoing-hint" hidden>지금 한 판이 진행 중이에요! 끝나면 자동으로 함께해요 ⏳</p>
        </div>

        <div class="btn-group">
          <button id="btnStart" class="btn btn--primary" disabled>시작!</button>
          <button id="btnExit" class="btn btn--secondary">광장으로</button>
        </div>
      </section>

      <!-- ══════════════════════════════════════
           플레이 화면 — 캔버스 아레나
           ══════════════════════════════════════ -->
      <section id="playScreen" class="screen screen--play">
        <header class="play-hud">
          <div id="timerDisplay" class="play-timer">60</div>
          <div id="territoryBar" class="territory-bar"></div>
        </header>
        <div class="arena-wrap">
          <canvas id="arena"></canvas>
          <div id="countOverlay" class="count-overlay" hidden></div>
        </div>
        <p class="play-hint">화면을 누르고 끌면 그쪽으로 달려가요 (키보드: WASD/방향키)</p>
      </section>

      <!-- ══════════════════════════════════════
           결과 화면
           ══════════════════════════════════════ -->
      <section id="overScreen" class="screen">
        <div class="result-card">
          <h2 class="result-title" id="resultTitle">결과 발표!</h2>
          <p class="result-score-label">내가 칠한 영역</p>
          <p id="finalScore" class="result-score">0%</p>
          <ul id="finalRanking" class="final-ranking"></ul>

          <div class="btn-group">
            <button id="btnRestart" class="btn btn--primary">다시 하기</button>
            <button id="btnExitOver" class="btn btn--secondary">광장으로</button>
          </div>
        </div>
      </section>

    </main>

    <!-- 반드시 이 순서를 지키세요: registry → config → bootstrap → characters → relay → game -->
    <script src="/games/registry.js"></script>
    <script src="/shared/config.js"></script>
    <script src="/shared/bootstrap.js"></script>
    <script src="/shared/character_sprites.js"></script>
    <script src="/shared/relay.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
