<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>말랑프렌즈 협동대모험 (프로토타입 S1)</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="game" class="game-canvas"></div>

    <!-- 세로(portrait)일 때 가로 회전 안내. 횡스크롤은 가로모드가 전방 시야에 유리. -->
    <div id="rotateHint" class="rotate-hint">
      <div class="rotate-hint__icon">📱↔️</div>
      <div class="rotate-hint__text">가로로 돌려서 플레이하면<br />앞이 더 잘 보여요!</div>
    </div>

    <!-- 가상패드 (S1: 좌 이동 / 우 점프). 멀티터치 + pointer 이벤트 -->
    <div class="pad pad-left" aria-hidden="true">
      <button id="btnLeft" class="pad-btn" type="button">◀</button>
      <button id="btnRight" class="pad-btn" type="button">▶</button>
    </div>
    <div class="pad pad-right" aria-hidden="true">
      <button id="btnJump" class="pad-btn pad-btn--jump" type="button">점프</button>
    </div>

    <!-- S8: 이모트 버튼 (협동 소통 핵심). 누르면 캐릭터 머리 위 말풍선 + (추후)파트너 전송.
         기본 숨김(CSS) → PlayScene 진입 시에만 표시(맵에서 먹통 버튼 방지) -->
    <div class="emote-bar" id="emoteBar">
      <button class="emote-btn" type="button" data-emote="come" aria-label="빨리 와">🙋</button>
      <button class="emote-btn" type="button" data-emote="sorry" aria-label="미안">🙇</button>
      <button class="emote-btn" type="button" data-emote="good" aria-label="굿">👍</button>
    </div>

    <!-- 엔진: 버전 고정 vendor (무빌드) -->
    <script src="/shared/vendor/phaser-3.88.2.min.js"></script>
    <!-- 플랫폼 공통: 설정·부트·릴레이 SDK (RelayTransport가 MallangRelay 사용) -->
    <script src="/shared/config.js"></script>
    <script src="/shared/bootstrap.js"></script>
    <script src="/shared/relay.js"></script>
    <!-- 입력 → 보간 → 전송계층 → 넷클라 → 진도/스테이지 → 씬 → 부트 순서 -->
    <script src="./src/input.js"></script>
    <script src="./src/net.js"></script>
    <script src="./src/transport.js"></script>
    <script src="./src/netclient.js"></script>
    <script src="./src/progress.js"></script>
    <script src="./src/stages.js"></script>
    <script src="./src/scenes/play.js"></script>
    <script src="./src/scenes/map.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
