<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>협동대모험 — 캐릭터 뷰어</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", sans-serif;
        background: linear-gradient(180deg, #cfeaff 0%, #eaf7ff 45%, #fff7ec 100%);
        color: #2c2a3a;
        min-height: 100vh;
      }
      header {
        padding: 18px 20px 10px;
        text-align: center;
      }
      header h1 { margin: 0 0 4px; font-size: 22px; }
      header p { margin: 0; font-size: 13px; color: #5a6577; }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        align-items: center;
        padding: 8px 12px 14px;
      }
      .toolbar button, .toolbar label {
        font: inherit;
        font-size: 13px;
        border: 1px solid #b9c6da;
        background: #fff;
        color: #344;
        border-radius: 999px;
        padding: 7px 14px;
        cursor: pointer;
        user-select: none;
        box-shadow: 0 1px 0 rgba(0,0,0,0.04);
      }
      .toolbar button.active { background: #4c8dff; border-color: #4c8dff; color: #fff; }
      .toolbar label { display: inline-flex; align-items: center; gap: 8px; cursor: default; }
      .toolbar input[type="range"] { cursor: pointer; }

      #stage { display: block; margin: 0 auto; }

      .grid-wrap {
        max-width: 920px;
        margin: 6px auto 40px;
        padding: 0 16px;
      }
      .grid-wrap h2 { font-size: 15px; margin: 18px 4px 8px; }
      .frames {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 6px;
      }
      .frames .cell {
        position: relative;
        background:
          linear-gradient(45deg, #e7edf5 25%, transparent 25%, transparent 75%, #e7edf5 75%) 0 0 / 16px 16px,
          linear-gradient(45deg, #e7edf5 25%, #fff 25%, #fff 75%, #e7edf5 75%) 8px 8px / 16px 16px;
        background-color: #fff;
        border: 1px solid #d6deea;
        border-radius: 8px;
        aspect-ratio: 1;
        overflow: hidden;
      }
      .frames .cell > div {
        width: 100%; height: 100%;
        background-repeat: no-repeat;
      }
      .frames .cell .idx {
        position: absolute; top: 2px; left: 4px;
        font-size: 10px; color: #7a8699; font-weight: 700;
      }
      .frames .cell.is-idle { outline: 2px solid #ffb02e; outline-offset: -2px; }
      .charblock { margin-top: 10px; }
      .charblock h3 { margin: 0 0 6px 4px; font-size: 14px; }
      .charblock .meta { font-size: 11px; color: #7a8699; font-weight: 500; }
    </style>
    <script src="/shared/vendor/phaser-3.88.2.min.js"></script>
  </head>
  <body>
    <header>
      <h1>🐾 협동대모험 캐릭터 뷰어</h1>
      <p>codex로 생성한 5종 스프라이트(병아리·고양이·강아지·토끼·햄스터)를 게임과 동일한 애니메이션으로 미리보기</p>
    </header>

    <div class="toolbar">
      <button id="btnRun" class="active" type="button">🏃 달리기</button>
      <button id="btnIdle" type="button">🧍 정지(idle)</button>
      <button id="btnFlip" type="button">↔ 방향전환</button>
      <label>속도 <input id="fps" type="range" min="4" max="30" value="18" /> <span id="fpsv">18</span>fps</label>
    </div>

    <div id="stage"></div>

    <div class="grid-wrap" id="grids"></div>

    <script>
      // play.js와 동일한 프레임 정렬 순서 (유사도 체인 + yoyo). frame0=idle 제외.
      const CHARS = [
        { id: "chick",   name: "병아리 (나)",   order: [12,15,14,7,13,11,8,5,1,4,3,2,9,10,6] },
        { id: "cat",     name: "고양이 (친구)", order: [4,14,2,10,12,8,3,6,1,15,7,5,13,9,11] },
        { id: "puppy",   name: "강아지",        order: [1,9,5,13,11,4,14,15,3,12,6,8,7,2,10] },
        { id: "rabbit",  name: "토끼",          order: [5,14,8,11,2,9,7,1,12,3,10,6,15,4,13] },
        { id: "hamster", name: "햄스터",        order: [7,8,15,6,9,1,14,2,11,3,10,4,12,5,13] },
      ];
      const FRAME = 256;     // 시트 한 칸 픽셀
      const SHOW = 132;      // 스테이지 표시 크기
      const GAP = 36;
      const COLW = SHOW + GAP;

      // ⚠️ Phaser는 plain-object scene config에서 preload/create/update 등
      // "생명주기 메서드"만 scene 인스턴스로 복사한다. 커스텀 속성/메서드는 복사되지 않으므로
      // 상태는 create 내부 지역변수로 두고, 컨트롤러는 클로저로 window.__viewer에 직접 노출한다.
      const ViewerScene = {
        preload: function () {
          CHARS.forEach((c) => {
            this.load.spritesheet(c.id + "-run", "./assets/" + c.id + "-run.png",
              { frameWidth: FRAME, frameHeight: FRAME });
          });
        },

        create: function () {
          const scene = this;
          const sprites = [];
          let fps = 18;
          let mode = "run"; // run | idle
          let flip = false;

          const total = CHARS.length * COLW - GAP;
          const startX = (scene.scale.width - total) / 2 + SHOW / 2;
          const groundY = 250;

          CHARS.forEach((c, i) => {
            const key = c.id + "-run";
            if (!scene.anims.exists(key)) {
              scene.anims.create({
                key, frameRate: fps, yoyo: true, repeat: -1,
                frames: scene.anims.generateFrameNumbers(key, { frames: c.order }),
              });
            }
            const x = startX + i * COLW;
            // 발판
            scene.add.rectangle(x, groundY + 6, SHOW - 8, 12, 0x8a674b).setOrigin(0.5, 0);
            scene.add.rectangle(x, groundY + 6, SHOW - 8, 12, 0x000000, 0.12).setOrigin(0.5, 0);
            // 스프라이트 (origin 발바닥 = play.js와 동일)
            const spr = scene.add.sprite(x, groundY + 6, key, 0)
              .setOrigin(0.5, 1).setDisplaySize(SHOW, SHOW);
            spr.play(key, true);
            sprites.push(spr);
            // 이름표
            scene.add.text(x, groundY + 24, c.name, {
              fontFamily: "sans-serif", fontSize: "14px", color: "#2c2a3a", fontStyle: "bold",
            }).setOrigin(0.5, 0);
          });

          // 외부(툴바) 컨트롤러 — 클로저로 상태 캡처
          window.__viewer = {
            scene, sprites,
            setMode: function (m) {
              mode = m;
              sprites.forEach(function (spr, i) {
                const key = CHARS[i].id + "-run";
                if (m === "run") spr.play(key, true);
                else { spr.stop(); spr.setFrame(0); } // idle = frame0
              });
            },
            setFlip: function (f) {
              flip = f;
              sprites.forEach(function (spr) { spr.setFlipX(f); });
            },
            setFps: function (v) {
              fps = v;
              sprites.forEach(function (spr, i) {
                const key = CHARS[i].id + "-run";
                const anim = scene.anims.get(key);
                if (anim) anim.frameRate = v;
                if (mode === "run") { spr.stop(); spr.play(key, true); }
              });
            },
          };
        },
      };

      const game = new Phaser.Game({
        type: Phaser.AUTO,
        parent: "stage",
        width: Math.min(window.innerWidth - 8, CHARS.length * COLW + 40),
        height: 300,
        transparent: true,
        scene: ViewerScene,
        scale: { mode: Phaser.Scale.NONE },
      });
      // 검증용: hidden 탭에서 rAF가 멈추면 수동으로 loop.step 펌프 가능하게 노출
      window.__game = game;

      // ── 툴바 ──
      const $ = (id) => document.getElementById(id);
      $("btnRun").onclick = () => { setMode("run"); };
      $("btnIdle").onclick = () => { setMode("idle"); };
      function setMode(m) {
        $("btnRun").classList.toggle("active", m === "run");
        $("btnIdle").classList.toggle("active", m === "idle");
        window.__viewer && window.__viewer.setMode(m);
      }
      let flipped = false;
      $("btnFlip").onclick = () => {
        flipped = !flipped;
        $("btnFlip").classList.toggle("active", flipped);
        window.__viewer && window.__viewer.setFlip(flipped);
      };
      $("fps").oninput = (e) => {
        const v = +e.target.value;
        $("fpsv").textContent = v;
        window.__viewer && window.__viewer.setFps(v);
      };

      // ── 프레임 그리드(전체 16프레임 콘택트 시트, frame0=idle 강조) ──
      // CSS background-position으로 시트에서 칸을 잘라 표시. 4x4 그리드 가정.
      function buildGrids() {
        const wrap = $("grids");
        wrap.innerHTML = "<h2>📋 전체 프레임 (frame0 = idle, 노란 테두리)</h2>";
        CHARS.forEach((c) => {
          const block = document.createElement("div");
          block.className = "charblock";
          const playOrder = c.order.join(", ");
          block.innerHTML = `<h3>${c.name} <span class="meta">재생순서: ${playOrder}</span></h3>`;
          const grid = document.createElement("div");
          grid.className = "frames";
          const url = `./assets/${c.id}-run.png`;
          for (let f = 0; f < 16; f++) {
            const r = Math.floor(f / 4), col = f % 4;
            const cell = document.createElement("div");
            cell.className = "cell" + (f === 0 ? " is-idle" : "");
            const img = document.createElement("div");
            // 시트는 1024x1024(4x4). 셀 표시폭에 맞춰 400% 스케일 + 위치 이동.
            img.style.backgroundImage = `url("${url}")`;
            img.style.backgroundSize = "400% 400%";
            img.style.backgroundPosition = `${(col / 3) * 100}% ${(r / 3) * 100}%`;
            cell.appendChild(img);
            const idx = document.createElement("span");
            idx.className = "idx";
            idx.textContent = f;
            cell.appendChild(idx);
            grid.appendChild(cell);
          }
          block.appendChild(grid);
          wrap.appendChild(block);
        });
      }
      buildGrids();
    </script>
  </body>
</html>
