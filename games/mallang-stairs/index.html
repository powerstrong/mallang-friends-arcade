<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>말랑 계단 레이스</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <section id="setupScreen" class="screen is-active">
        <div class="setup-inner">
          <h1 class="title">
            <span class="title__main">말랑 계단 레이스</span>
            <span class="title__sub">왼쪽·오른쪽을 눌러 최고 계단까지!</span>
          </h1>

          <div class="char-stage">
            <img id="setupCharImg" class="char-stage__img" src="" alt="" draggable="false" />
            <div class="char-stage__name" id="setupCharName">말랑 병아리</div>
            <div class="char-stage__role" id="setupCharRole"></div>
            <p class="char-stage__ability" id="setupCharAbility"></p>
          </div>

          <div class="char-pick" id="charPick" role="listbox" aria-label="캐릭터 선택"></div>
          <section id="roomPanel" class="room-panel" aria-live="polite">
            <ol id="rosterList" class="roster-list is-hidden"></ol>
            <div class="time-picker" aria-label="경기 시간">
              <button type="button" class="time-option" data-sec="60">1분</button>
              <button type="button" class="time-option" data-sec="120">2분</button>
              <button type="button" class="time-option" data-sec="180">3분</button>
            </div>
            <p id="roomStatus" class="room-status is-hidden"></p>
          </section>

          <div class="setup-actions">
            <button id="startBtn" type="button" class="btn btn--primary">시작</button>
            <button id="leaveBtn" type="button" class="btn btn--ghost">광장으로</button>
          </div>
          <p class="setup-note" id="multiNote"></p>
        </div>
      </section>

      <section id="playScreen" class="screen">
        <header class="hud">
          <div class="hud__row">
            <div class="hud__stat hud__stat--time">
              <span class="hud__label">남은 시간</span>
              <strong id="hudTime">--:--</strong>
            </div>
            <div class="hud__stat hud__stat--step">
              <span class="hud__label">계단</span>
              <strong id="hudStep">0</strong>
            </div>
            <div class="hud__stat hud__stat--best">
              <span class="hud__label">내 최고층</span>
              <strong id="hudBest">0</strong>
            </div>
          </div>
          <div class="hud__row hud__row--compact">
            <div class="hud__stat hud__stat--score">
              <span class="hud__label">점수</span>
              <strong id="hudScore">0</strong>
            </div>
            <div class="hud__stat hud__stat--combo">
              <span class="hud__label">콤보</span>
              <strong id="hudCombo">0</strong>
            </div>
          </div>
          <div class="gauge gauge--time">
            <div class="gauge__fill" id="timeFill"></div>
            <span class="gauge__tag">LIFE</span>
          </div>
          <div class="gauge gauge--fever">
            <div class="gauge__fill" id="feverFill"></div>
            <span class="gauge__tag">FEVER</span>
          </div>
          <div class="live-rank" id="rivalWrap" aria-label="라이브 순위"></div>
        </header>

        <div id="stage" class="stage">
          <div id="stageBgA" class="stage-bg stage-bg--a is-visible" aria-hidden="true"></div>
          <div id="stageBgB" class="stage-bg stage-bg--b" aria-hidden="true"></div>
          <div id="cloudLayer" class="cloud-layer" aria-hidden="true"></div>
          <div id="stairLayer" class="stair-layer"></div>
          <div id="stageFx" class="stage-fx" aria-hidden="true"></div>
          <div id="player" class="player">
            <img id="comboFlame" class="combo-flame" src="./assets/fx-combo-flame.png" alt="" draggable="false" />
            <img id="playerImg" src="" alt="" draggable="false" />
          </div>

          <div class="touch-zones" aria-hidden="true">
            <div class="touch-zones__side touch-zones__side--left"><span>←</span></div>
            <div class="touch-zones__side touch-zones__side--right"><span>→</span></div>
          </div>

          <div id="feverFx" class="fever-fx" aria-hidden="true"></div>
          <div id="floatLayer" class="float-layer" aria-hidden="true"></div>
          <div id="countdown" class="countdown is-hidden"><span id="countNum">3</span></div>

        </div>

        <div id="resultOverlay" class="result-overlay is-hidden">
          <div class="result-card">
            <h2 class="result-card__title" id="resultTitle">결과</h2>
            <img id="resultTrophy" class="result-card__trophy is-hidden" src="./assets/ui-trophy.png" alt="" draggable="false" />
            <img id="resultCharImg" class="result-card__char" src="" alt="" draggable="false" />
            <div class="result-grid">
              <div class="result-grid__cell"><span>최고 계단</span><strong id="resStep">0</strong></div>
              <div class="result-grid__cell"><span>점수</span><strong id="resScore">0</strong></div>
              <div class="result-grid__cell"><span>최대 콤보</span><strong id="resCombo">0</strong></div>
              <div class="result-grid__cell"><span>Perfect</span><strong id="resPerfect">0</strong></div>
            </div>
            <div class="result-card__char-name" id="resCharName"></div>
            <p class="result-card__ability" id="resCharAbility"></p>
            <div id="resultRank" class="result-rank is-hidden"></div>
            <p id="retryHint" class="retry-hint"></p>
            <div class="result-card__actions">
              <button id="retryBtn" type="button" class="btn btn--primary">한판 더</button>
              <button id="exitBtn" type="button" class="btn btn--ghost">광장으로</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/games/registry.js"></script>
    <script src="/shared/bootstrap.js"></script>
    <script src="/shared/relay.js"></script>
    <script src="./characters.js"></script>
    <script src="./stairs-engine.js"></script>
    <script src="./multiplayer.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
