<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- 다크모드 자동 반전 OFF: 쓱쓱 일러스트/패널은 라이트 톤 기준으로 디자인됐다.
         iOS Safari·Edge 등이 강제 다크 모드를 적용해 캐릭터가 어둡게 깨지는 문제
         해결. CSS :root 의 color-scheme: light only 와 함께 동작. -->
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#10b981" />
    <title>말랑프렌즈 쓱쓱</title>
    <link rel="icon" href="../jump-climber/assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game-shell">

      <!-- Setup: 캐릭터 선택 + Ready -->
      <section id="setupScreen" class="screen screen--setup is-active">
        <section class="panel setup-panel" aria-labelledby="setupTitle">
          <p class="eyebrow">MALLANG SSEUK-SSEUK</p>
          <h1 id="setupTitle">말랑프렌즈 쓱쓱</h1>
          <img class="hero-draw float-anim" src="./assets/hero_draw.webp" alt="" aria-hidden="true" />
          <p class="setup-copy">캐릭터를 고르고 Ready를 누르면 시작해요. 한 명이 그리고 나머지가 맞혀요!</p>

          <div id="myCharacterCard" class="my-character" aria-live="polite">
            <img id="myCharacterImg" class="my-character__img" src="" alt="" />
            <div class="my-character__info">
              <p class="eyebrow">랜덤 배정</p>
              <strong id="myCharacterName">…</strong>
            </div>
          </div>

          <div id="bootStatus" class="boot-status" aria-live="polite">연결 대기 중…</div>
          <div id="waitingPlayers" class="waiting-players" aria-label="대기 중인 플레이어" aria-live="polite"></div>

          <div class="setup-actions">
            <button id="readyBtn" type="button" class="primary-action">Ready!</button>
          </div>
        </section>
      </section>

      <!-- Game: 라운드 / 출제자 모집 / 그리는 중 -->
      <section id="gameScreen" class="screen screen--game">
        <header class="game-header">
          <button id="gameExitBtn" type="button" class="game-exit-btn" aria-label="방으로 돌아가기">← 나가기</button>
          <div class="round-info">
            <span id="roundProgress" class="round-progress"></span>
            <span id="roundDifficulty" class="round-difficulty" aria-live="polite"></span>
          </div>
          <div class="header-meta">
            <button id="muteBtn" type="button" class="mute-btn" aria-label="음소거 토글" aria-pressed="false" title="음소거">🔊</button>
            <div id="timerDisplay" class="timer-display"></div>
          </div>
        </header>
        <!-- 헤더 아래 가로 진행바 — 시간 흐름 시각화 + 마지막 10초 펄스. -->
        <div id="timerBarTrack" class="timer-bar-track is-hidden" aria-hidden="true">
          <span id="timerBarFill" class="timer-bar-fill"></span>
        </div>

        <!-- 첫 정답으로 보너스 phase 진입할 때 1번 띄우는 중앙 배너. -->
        <div id="bonusBanner" class="bonus-banner is-hidden" aria-live="assertive">+10초 BONUS!</div>

        <!-- Countdown overlay -->
        <div id="countdownOverlay" class="countdown-overlay is-hidden" aria-live="assertive">
          <div id="countdownNumber" class="countdown-number">3</div>
          <p class="countdown-label">곧 시작!</p>
        </div>

        <!-- Volunteer phase -->
        <section id="volunteerPanel" class="panel volunteer-panel is-hidden">
          <p class="eyebrow">출제자 모집 중</p>
          <h2>이번 라운드, 누가 그릴래요?</h2>
          <img class="hero-draw hero-draw--mini float-anim" src="./assets/hero_draw.webp" alt="" aria-hidden="true" loading="lazy" decoding="async" />
          <p class="volunteer-copy">그리고 싶은 사람은 손 들어요!</p>
          <button id="volunteerBtn" type="button" class="primary-action">✋ 그리고 싶어요!</button>
          <div id="volunteerList" class="volunteer-list" aria-live="polite"></div>
          <p id="volunteerTimer" class="volunteer-timer"></p>
        </section>

        <!-- Lottery -->
        <section id="lotteryPanel" class="panel lottery-panel is-hidden" aria-live="polite">
          <p class="eyebrow">추첨 중</p>
          <div id="lotteryRoulette" class="lottery-roulette"></div>
        </section>

        <!-- Drawing phase -->
        <section id="drawingPanel" class="panel drawing-panel is-hidden">
          <div id="drawerBanner" class="drawer-banner"></div>
          <!-- 정답 누구·언제 맞혔는지 칩으로 1줄. SS_CORRECT 마다 업데이트, 라운드 시작 시 리셋. -->
          <div id="miniLeaderboard" class="mini-leaderboard is-hidden" aria-live="polite"></div>
          <div id="keywordSlot" class="keyword-slot" aria-live="polite"></div>
          <div class="canvas-wrap">
            <canvas id="drawCanvas" width="1000" height="1000" aria-label="그림판"></canvas>
          </div>
          <div id="canvasToolbar" class="canvas-toolbar is-hidden" aria-label="그리기 도구">
            <div class="tool-group color-group">
              <button type="button" class="color-btn is-selected" data-color="#000000" style="background:#000" aria-label="검정"></button>
              <button type="button" class="color-btn" data-color="#ef4444" style="background:#ef4444" aria-label="빨강"></button>
              <button type="button" class="color-btn" data-color="#3b82f6" style="background:#3b82f6" aria-label="파랑"></button>
              <button type="button" class="color-btn" data-color="#22c55e" style="background:#22c55e" aria-label="초록"></button>
              <button type="button" class="color-btn" data-color="#f59e0b" style="background:#f59e0b" aria-label="주황"></button>
              <button type="button" class="color-btn" data-color="#eab308" style="background:#eab308" aria-label="노랑"></button>
            </div>
            <div class="tool-group thickness-group">
              <button type="button" class="thick-btn" data-thickness="3"><span style="width:6px;height:6px"></span></button>
              <button type="button" class="thick-btn is-selected" data-thickness="8"><span style="width:12px;height:12px"></span></button>
              <button type="button" class="thick-btn" data-thickness="16"><span style="width:18px;height:18px"></span></button>
            </div>
            <div class="tool-group">
              <button type="button" id="undoBtn" class="tool-btn">↶</button>
              <button type="button" id="clearBtn" class="tool-btn">🗑</button>
            </div>
          </div>

          <!-- 채팅 (drawing/bonus phase 동안만 표시) -->
          <div id="chatBox" class="chat-box">
            <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
            <!-- 정답 발생 시 1.2s 띄우는 상단 토스트 (입력바 바로 위). -->
            <div id="correctToast" class="correct-toast is-hidden" aria-live="assertive"></div>
            <form id="chatForm" class="chat-input-bar" autocomplete="off">
              <input id="chatInput" type="text" class="chat-input-field" placeholder="추측을 입력…" maxlength="80" autocomplete="off" />
              <button id="chatSend" type="submit" class="chat-send-btn">보내기</button>
            </form>
          </div>
        </section>

        <!-- Round result -->
        <section id="roundEndPanel" class="panel round-end-panel is-hidden" aria-live="polite">
          <p class="eyebrow">라운드 종료</p>
          <img id="celebrateImg" class="hero-celebrate pop-anim is-hidden" src="./assets/hero_celebrate.webp" alt="" aria-hidden="true" loading="lazy" decoding="async" />
          <h2 id="roundEndKeyword"></h2>
          <p id="roundEndReason" class="round-end-reason"></p>
          <!-- 정답 리플레이: SS_ROUND_END 도착 시 클라이언트 측 allStrokes 를
               1.5초 안에 재생한 뒤 최종 그림 그대로 정지. 빈 캔버스 이면
               (라운드 중 그림 없었음) is-hidden 으로 숨김. -->
          <div id="replayWrap" class="replay-wrap is-hidden">
            <canvas id="replayCanvas" class="replay-canvas" width="400" height="400" aria-label="라운드 그림 리플레이"></canvas>
            <p class="replay-caption">정답 그림 다시 보기</p>
          </div>
          <ol id="roundEndDeltas" class="round-end-deltas"></ol>
        </section>
      </section>

      <!-- Result: 최종 순위 -->
      <section id="resultScreen" class="screen screen--result">
        <section class="panel rankings-panel" aria-labelledby="rankingsTitle">
          <p class="eyebrow">최종 결과</p>
          <img class="hero-trophy spin-in-anim" src="./assets/hero_trophy.webp" alt="" aria-hidden="true" loading="lazy" decoding="async" />
          <h2 id="rankingsTitle">쓱쓱 한 판 끝!</h2>
          <p id="myAwardLine" class="my-award-line is-hidden"></p>
          <ol id="rankingsList" class="rankings-list"></ol>
          <div class="result-actions">
            <button id="exitBtn" type="button" class="secondary-action">방으로 돌아가기</button>
          </div>
        </section>
      </section>

    </main>

    <script src="/games/registry.js"></script>
    <script src="/shared/bootstrap.js"></script>
    <script src="/shared/config.js"></script>
    <script src="./audio.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
