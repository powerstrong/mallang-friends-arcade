<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>말랑프렌즈 키우기</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <header class="hud">
    <div class="hud-left">
      <div class="hud-stage"><b id="stageNum">1</b><span>스테이지</span></div>
      <div class="hud-chapter" id="chapterName">말랑 들판</div>
    </div>
    <div class="hud-right">
      <div class="hud-gold"><i class="coin"></i><b id="goldNum">0</b></div>
      <div class="hud-power">전투력 <b id="powerNum">0</b></div>
    </div>
    <button class="mute-btn" id="muteBtn" aria-label="소리">🔊</button>
  </header>

  <section class="arena" id="arena">
    <div class="bg-layer" id="bgLayer"></div>
    <div class="ambient-layer" id="ambientLayer"></div>
    <div class="fg-layer" id="fgLayer"></div>
    <img class="speedlines" id="speedLines" src="assets/fx-lines.jpg" alt="" hidden />

    <div class="stage-progress" id="stageProgress">
      <span id="progressText">0 / 10</span>
      <div class="pips" id="progressPips"></div>
    </div>

    <div class="boss-timer" id="bossTimer" hidden>
      <div class="boss-timer-label">남은 시간</div>
      <div class="boss-timer-bar"><i id="bossTimerFill"></i></div>
      <div class="boss-timer-num" id="bossTimerNum">25.0</div>
      <div class="boss-need" id="bossNeed"></div>
    </div>

    <div class="field">
      <img class="boss-ring" id="bossRing" src="assets/fx-bossring.png" alt="" hidden />
      <div class="follower f2" id="follower2"></div>
      <div class="follower f1" id="follower1"></div>
      <div class="hero" id="hero"></div>
      <div class="enemy" id="enemy" hidden>
        <div class="enemy-name" id="enemyName"></div>
        <div class="enemy-hp"><i id="enemyHpFill"></i></div>
        <img id="enemyArt" alt="" />
      </div>
      <div class="fx-layer" id="fxLayer"></div>
    </div>

    <div class="ground"></div>
    <div class="toast-stack" id="toastStack"></div>

    <div class="boss-bubble" id="bossBubble" hidden></div>
    <div class="chapter-banner" id="chapterBanner" hidden>
      <b id="chapterBannerName"></b>
      <span id="chapterBannerTag"></span>
    </div>
  </section>

  <nav class="tabs" id="tabs">
    <button data-tab="upgrade" class="on">강화</button>
    <button data-tab="party">편성 <i class="dot" id="partyDot" hidden></i></button>
    <button data-tab="relic">유물 <i class="dot" id="relicDot" hidden></i></button>
    <button data-tab="battle">도전 <i class="dot" id="battleDot" hidden></i></button>
    <button data-tab="book">도감</button>
  </nav>

  <section class="panel" id="panelUpgrade">
    <div class="panel-head">
      <span class="panel-title">강화</span>
      <div class="bulk" id="bulkToggle">
        <button data-bulk="1" class="on">x1</button>
        <button data-bulk="10">x10</button>
        <button data-bulk="max">MAX</button>
      </div>
    </div>
    <div class="upgrades" id="upgrades"></div>
    <div class="panel-foot">
      <span class="dps-hint" id="dpsHint">DPS 0</span>
      <button class="exit" id="exitBtn">나가기</button>
    </div>
  </section>

  <section class="panel" id="panelRelic" hidden>
    <div class="panel-head">
      <span class="panel-title">유물</span>
      <span class="shard-count">⭐ <b id="shardNum">0</b></span>
    </div>
    <div class="upgrades" id="relicList"></div>
    <div class="panel-foot">
      <span class="dps-hint">별조각은 보스가 떨어뜨려요</span>
      <button class="exit" id="exitBtn3">나가기</button>
    </div>
  </section>

  <section class="panel" id="panelBattle" hidden>
    <div class="dungeon-card">
      <img class="dungeon-icon" id="dungeonIcon" src="assets/icon-dungeon.png" alt="" />
      <div class="dungeon-body">
        <div class="dungeon-name">별빛 시련</div>
        <div class="dungeon-sub"><span id="dungeonRuns"></span> · 최고 <b id="dungeonBest">0</b>연승</div>
      </div>
      <button class="dungeon-go" id="dungeonGo">입장</button>
    </div>
    <div class="quests" id="questList"></div>
    <div class="panel-foot">
      <span class="dps-hint">매일 자정에 새로워져요</span>
      <button class="exit" id="exitBtn4">나가기</button>
    </div>
  </section>

  <section class="panel" id="panelBook" hidden>
    <div class="panel-head">
      <span class="panel-title">도감 <b id="bookCount"></b></span>
    </div>
    <div class="book-grid" id="bookGrid"></div>
    <div class="panel-foot">
      <span class="dps-hint" id="bookHint"></span>
      <button class="exit" id="exitBtn5">나가기</button>
    </div>
  </section>

  <section class="panel" id="panelParty" hidden>
    <div class="panel-head">
      <span class="panel-title">편성 <b id="partySlots">1 / 1</b></span>
      <span class="party-hint" id="partyHint">탭해서 넣고 빼요</span>
    </div>
    <div class="party-list" id="partyList"></div>
    <div class="panel-foot">
      <span class="dps-hint" id="partyBonusHint"></span>
      <button class="exit" id="exitBtn2">나가기</button>
    </div>
  </section>

</div>

<!-- 타이틀: 로고와 시작 버튼뿐. 조작법은 글이 아니라 첫 플레이의 코치마크가 가르친다. -->
<div class="intro" id="intro" hidden>
  <img class="intro-logo" src="assets/title-logo.png" alt="말랑프렌즈 키우기" />
  <h1 class="intro-title">말랑프렌즈 키우기</h1>
  <button id="introStart">시작하기</button>
</div>

<!-- 스토리 컷신 — 탭해서 진행, 건너뛰기 가능. 떠 있는 동안 게임 시간 정지. -->
<div class="story" id="storyOverlay" hidden>
  <button class="story-skip" id="storySkip">건너뛰기 ▸</button>
  <div class="story-card" id="storyCard">
    <img class="story-portrait" id="storyPortrait" alt="" />
    <div class="story-body">
      <div class="story-name" id="storyName"></div>
      <div class="story-text" id="storyText"></div>
    </div>
    <span class="story-more">▼</span>
  </div>
</div>

<div class="modal" id="dungeonModal" hidden>
  <div class="modal-card">
    <h2 id="dungeonTitle">별빛 시련</h2>
    <p class="modal-sub" id="dungeonSub"></p>
    <div class="dungeon-result" id="dungeonKills"></div>
    <div class="modal-gold"><span class="shard-count">⭐ <b id="dungeonShards">0</b></span><i class="coin"></i><b id="dungeonGold">0</b></div>
    <button id="dungeonOk">확인</button>
  </div>
</div>

<!-- 멀티탭 가드 — 다른 탭이 저장을 이어받으면 이 탭은 멈추고, 복구 동선을 상시 제공한다. -->
<div class="modal tab-modal" id="tabModal" hidden>
  <div class="modal-card">
    <h2>다른 탭에서 플레이 중</h2>
    <p class="modal-sub">같은 저장을 두 곳에서 쓰면 진행이 사라질 수 있어서<br />이 탭을 잠시 멈췄어요.</p>
    <button id="tabReload">최신 저장 불러오기</button>
    <button class="ghost" id="tabResume">이 탭에서 이어하기</button>
  </div>
</div>

<div class="modal" id="offlineModal" hidden>
  <div class="modal-card">
    <h2>다녀오셨어요!</h2>
    <p class="modal-sub" id="offlineSub">자리를 비운 동안 친구들이 열심히 모았어요.</p>
    <div class="modal-gold"><i class="coin"></i><b id="offlineGold">0</b></div>
    <button id="offlineOk">받기</button>
  </div>
</div>

<div class="devpanel" id="devPanel" hidden>
  <div class="dev-title">DEV</div>
  <div class="dev-row">
    <button data-dev="gold:10000">+10K</button>
    <button data-dev="gold:1000000">+1M</button>
    <button data-dev="gold:1e9">+1B</button>
  </div>
  <div class="dev-row">
    <button data-dev="stage:1">Stage +1</button>
    <button data-dev="stage:10">Stage +10</button>
    <button data-dev="boss">보스 즉시</button>
  </div>
  <div class="dev-row">
    <button data-dev="offline:3600">Off +1h</button>
    <button data-dev="offline:28800">Off +8h</button>
  </div>
  <div class="dev-row">
    <span>속도</span>
    <button data-dev="speed:1" class="on">x1</button>
    <button data-dev="speed:5">x5</button>
    <button data-dev="speed:20">x20</button>
  </div>
  <div class="dev-row">
    <button data-dev="save">Save</button>
    <button data-dev="export">Export</button>
    <button data-dev="import">Import</button>
    <button data-dev="reset">Reset</button>
  </div>
</div>

<script src="/games/registry.js"></script>
<script src="/shared/bootstrap.js"></script>
<!-- 로드 순서 주의: combat.js 가 characters.js 를, dungeon/quests 가 combat/balance 를 참조한다. -->
<script src="engine/balance.js"></script>
<script src="engine/rng.js"></script>
<script src="data/chapters.js"></script>
<script src="data/characters.js"></script>
<script src="engine/combat.js"></script>
<script src="engine/save.js"></script>
<script src="engine/dungeon.js"></script>
<script src="data/quests.js"></script>
<script src="data/story.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
