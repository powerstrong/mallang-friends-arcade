<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>말랑프렌즈 키우기</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <header class="hud">
    <div class="hud-left">
      <div class="hud-stage"><b id="stageNum">1</b><span>스테이지</span></div>
      <div class="hud-chapter" id="chapterName">말랑 들판</div>
    </div>
    <div class="hud-right">
      <div class="hud-gold"><i class="coin"></i><b id="goldNum">0</b></div>
      <div class="hud-power">전투력 <b id="powerNum">0</b></div>
    </div>
  </header>

  <section class="arena" id="arena">
    <div class="bg-layer" id="bgLayer"></div>

    <div class="stage-progress" id="stageProgress">
      <span id="progressText">0 / 10</span>
      <div class="pips" id="progressPips"></div>
    </div>

    <div class="boss-timer" id="bossTimer" hidden>
      <div class="boss-timer-label">남은 시간</div>
      <div class="boss-timer-bar"><i id="bossTimerFill"></i></div>
      <div class="boss-timer-num" id="bossTimerNum">25.0</div>
    </div>

    <div class="field">
      <img class="boss-ring" id="bossRing" src="assets/fx-bossring.png" alt="" hidden />
      <div class="hero" id="hero"></div>
      <div class="enemy" id="enemy" hidden>
        <div class="enemy-name" id="enemyName"></div>
        <div class="enemy-hp"><i id="enemyHpFill"></i></div>
        <img id="enemyArt" alt="" />
      </div>
    </div>

    <div class="ground"></div>
    <div class="toast-stack" id="toastStack"></div>
  </section>

  <nav class="tabs" id="tabs">
    <button data-tab="upgrade" class="on">강화</button>
    <button data-tab="party">편성 <i class="dot" id="partyDot" hidden></i></button>
  </nav>

  <section class="panel" id="panelUpgrade">
    <div class="panel-head">
      <span class="panel-title">강화</span>
      <div class="bulk" id="bulkToggle">
        <button data-bulk="1" class="on">x1</button>
        <button data-bulk="10">x10</button>
        <button data-bulk="max">MAX</button>
      </div>
    </div>
    <div class="upgrades" id="upgrades"></div>
    <div class="panel-foot">
      <span class="dps-hint" id="dpsHint">DPS 0</span>
      <button class="exit" id="exitBtn">나가기</button>
    </div>
  </section>

  <section class="panel" id="panelParty" hidden>
    <div class="panel-head">
      <span class="panel-title">편성 <b id="partySlots">1 / 1</b></span>
      <span class="party-hint">탭해서 넣고 빼요</span>
    </div>
    <div class="party-list" id="partyList"></div>
    <div class="panel-foot">
      <span class="dps-hint" id="partyBonusHint"></span>
      <button class="exit" id="exitBtn2">나가기</button>
    </div>
  </section>

</div>

<div class="intro" id="intro" hidden>
  <img class="intro-logo" src="assets/title-logo.png" alt="말랑프렌즈 키우기" />
  <h1 class="intro-title">말랑프렌즈 키우기</h1>
  <p class="intro-desc">
    말랑친구가 알아서 몬스터를 물리쳐요.<br />
    모은 골드로 <b>강화</b>하고, 보스를 <b>돌파</b>하세요.
  </p>
  <button id="introStart">시작하기</button>
</div>

<div class="modal" id="offlineModal" hidden>
  <div class="modal-card">
    <h2>다녀오셨어요!</h2>
    <p class="modal-sub" id="offlineSub">자리를 비운 동안 친구들이 열심히 모았어요.</p>
    <div class="modal-gold"><i class="coin"></i><b id="offlineGold">0</b></div>
    <button id="offlineOk">받기</button>
  </div>
</div>

<div class="devpanel" id="devPanel" hidden>
  <div class="dev-title">DEV</div>
  <div class="dev-row">
    <button data-dev="gold:10000">+10K</button>
    <button data-dev="gold:1000000">+1M</button>
    <button data-dev="gold:1e9">+1B</button>
  </div>
  <div class="dev-row">
    <button data-dev="stage:1">Stage +1</button>
    <button data-dev="stage:10">Stage +10</button>
    <button data-dev="boss">보스 즉시</button>
  </div>
  <div class="dev-row">
    <button data-dev="offline:3600">Off +1h</button>
    <button data-dev="offline:28800">Off +8h</button>
  </div>
  <div class="dev-row">
    <span>속도</span>
    <button data-dev="speed:1" class="on">x1</button>
    <button data-dev="speed:5">x5</button>
    <button data-dev="speed:20">x20</button>
  </div>
  <div class="dev-row">
    <button data-dev="save">Save</button>
    <button data-dev="export">Export</button>
    <button data-dev="import">Import</button>
    <button data-dev="reset">Reset</button>
  </div>
</div>

<script src="/games/registry.js"></script>
<script src="/shared/bootstrap.js"></script>
<!-- 로드 순서 주의: combat.js 가 characters.js 를 참조하므로 데이터가 먼저 와야 한다. -->
<script src="engine/balance.js"></script>
<script src="engine/rng.js"></script>
<script src="data/chapters.js"></script>
<script src="data/characters.js"></script>
<script src="engine/combat.js"></script>
<script src="engine/save.js"></script>
<script src="game.js"></script>
</body>
</html>
