<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7766d8">
  <meta name="description" content="라떼와 민트가 밀고 당겨 고장 난 장난감을 수리하는 결정론 전술 퍼즐">
  <title>말랑프렌즈 별빛작전</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/runtime/ui/icon-192.png">
  <style>
    :root {
      --ink:#332b4c; --muted:#6f6786; --paper:#fffdf8; --line:#d9d0ea;
      --violet:#7766d8; --violet-dark:#51449e; --sky:#70b9f1; --mint:#4fbd98;
      --coral:#e96d7e; --amber:#e0a83a; --floor-a:#eef6e3; --floor-b:#f6faec;
      --push:#3f86e6; --pull:#1fa98a;
      --cell:clamp(46px,13vw,58px); --shadow:0 12px 36px rgba(66,49,103,.18);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{min-height:100%;background:#ece6fa}
    body{min-height:100%;margin:0;color:var(--ink);overscroll-behavior:none;
      background:radial-gradient(circle at 15% 4%,#fff8cf 0 8%,transparent 28%),linear-gradient(165deg,#eee8ff,#e1f5ef);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
    button{font:inherit}
    button,[role=button]{touch-action:manipulation}
    button:focus-visible{outline:3px solid #2e6bb1;outline-offset:2px}
    .hidden,[hidden]{display:none!important}
    .app{width:min(100%,520px);min-height:100dvh;margin:0 auto;background:rgba(255,253,248,.94);box-shadow:var(--shadow)}
    .screen{display:none;min-height:100dvh}
    .screen.active{display:flex;flex-direction:column}
    .pill{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:5px 11px;border:1px solid rgba(81,68,158,.18);
      border-radius:999px;color:var(--violet-dark);background:rgba(255,255,255,.8);font-size:12px;font-weight:800}
    .button{min-height:48px;padding:11px 16px;border:0;border-radius:14px;color:#fff;background:var(--violet);
      box-shadow:0 5px 0 var(--violet-dark);font-weight:900;letter-spacing:-.01em;cursor:pointer;transition:transform .1s,filter .15s}
    .button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--violet-dark)}
    .button:disabled{opacity:.42;cursor:default;filter:grayscale(.2)}
    .button.secondary{color:var(--violet-dark);background:#eee9fa;box-shadow:0 4px 0 #cfc4e8}
    .button.go{background:var(--mint);box-shadow:0 5px 0 #2f8e6c}
    .button.danger{background:var(--coral);box-shadow:0 4px 0 #aa485b}
    .icon-button{display:inline-grid;place-items:center;width:46px;min-width:46px;height:46px;border:1px solid var(--line);
      border-radius:13px;color:var(--ink);background:var(--paper);font-size:20px;cursor:pointer}

    /* 홈 */
    .home-hero{position:relative;min-height:230px;padding:max(22px,env(safe-area-inset-top)) 22px 24px;overflow:hidden;color:#fff;
      background:#7060ce url("./assets/runtime/ui/hub-bg.webp") center 36%/cover no-repeat}
    .home-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(61,43,119,.08),rgba(46,35,91,.72))}
    .home-hero>*{position:relative;z-index:1}
    .brand-row{display:flex;justify-content:space-between;align-items:flex-start}
    .brand-kicker{margin:0 0 4px;font-size:13px;font-weight:900;letter-spacing:.08em}
    .brand-title{margin:0;font-size:clamp(30px,9vw,42px);line-height:1.02;letter-spacing:-.05em;text-shadow:0 3px 0 rgba(55,39,108,.35)}
    .brand-sub{max-width:300px;margin:10px 0 0;font-size:13.5px;line-height:1.55;font-weight:700}
    .hero-spacer{min-height:44px}
    .home-body{flex:1;padding:18px 16px max(24px,env(safe-area-inset-bottom))}
    .section-title{display:flex;align-items:end;justify-content:space-between;margin-bottom:10px}
    .section-title h2{margin:0;font-size:19px}
    .section-title small{color:var(--muted);font-weight:700}
    .puzzle-list{display:grid;gap:10px}
    .puzzle-card{display:grid;grid-template-columns:50px 1fr auto;align-items:center;gap:12px;width:100%;min-height:74px;padding:11px;
      border:1px solid var(--line);border-radius:16px;color:var(--ink);text-align:left;background:var(--paper);
      box-shadow:0 5px 14px rgba(61,48,92,.08);cursor:pointer}
    .puzzle-card.locked{opacity:.55;filter:grayscale(.6)}
    .puzzle-no{display:grid;place-items:center;width:50px;height:50px;border-radius:14px;color:#fff;background:var(--violet);font-size:20px;font-weight:950}
    .puzzle-copy b{display:block;font-size:15px}
    .puzzle-copy span{display:block;margin-top:3px;color:var(--muted);font-size:12px}
    .puzzle-stars{min-width:56px;color:var(--amber);font-size:15px;text-align:right;letter-spacing:-1px}
    .continue-area{display:grid;gap:9px;margin-top:14px}

    /* 전투 */
    .battle-screen{background:linear-gradient(#eee9fb,#f9f5e9)}
    .battle-bar{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:10px;
      padding:max(8px,env(safe-area-inset-top)) 10px 8px;background:var(--paper);border-bottom:1px solid var(--line)}
    .battle-heading{min-width:0}
    .battle-heading b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
    .battle-heading span{color:var(--muted);font-size:11px;font-weight:700}
    .beat-badge{min-width:74px;padding:6px 9px;border-radius:12px;color:#fff;text-align:center;background:var(--violet)}
    .beat-badge b{display:block;font-size:14px}
    .beat-badge small{font-size:10px;opacity:.9}
    .goal-bar{display:flex;align-items:center;gap:8px;min-height:44px;padding:7px 12px;color:#55481f;background:#fff3bd;border-bottom:1px solid #dfcc75;font-size:12px;line-height:1.35}
    .goal-bar .obj{font-weight:800}
    .board-scroll{flex:0 0 auto;padding:12px 4px 6px;overflow-x:auto;scrollbar-width:thin}
    .board{position:relative;display:grid;gap:2px;width:max-content;margin:0 auto;padding:3px;border:2px solid #6e618e;
      border-radius:15px;background:#cfc5df;box-shadow:0 9px 20px rgba(62,46,92,.24);overflow:hidden}
    .cell{position:relative;width:var(--cell);height:var(--cell);border:0;border-radius:5px;background:var(--floor-a);padding:0}
    .cell.alt{background:var(--floor-b)}
    .cell.wall{background:linear-gradient(145deg,#a597be,#81739f);box-shadow:inset 0 0 0 1px rgba(56,43,87,.25)}
    /* 이동칸은 옅게(어디든 갈 수 있음), 실제로 밀/당길 수 있는 칸만 밝게 강조 */
    .cell.reach::after{content:"";position:absolute;inset:6px;border-radius:6px;background:rgba(82,139,235,.12);box-shadow:inset 0 0 0 1.5px rgba(82,139,235,.4)}
    .cell.reach.cando::after{inset:3px;background:rgba(82,139,235,.36);box-shadow:inset 0 0 0 2px rgba(37,93,180,.8)}
    .cell.reach.pick::after{inset:3px;background:rgba(82,139,235,.52);box-shadow:inset 0 0 0 2px rgba(37,93,180,.9)}
    /* 위협(광선·돌진)은 항상 빨간 테두리로 — 파란 칸 위에서도 또렷하게 */
    .cell.beam::before,.cell.danger::before{content:"";position:absolute;inset:2px;border-radius:6px;background:rgba(224,75,97,.14);box-shadow:inset 0 0 0 2.5px rgba(224,75,97,.82)}
    .cell.danger::before{background:repeating-linear-gradient(135deg,rgba(224,75,97,.3) 0 6px,rgba(224,75,97,.06) 6px 12px)}
    .star-tile{position:absolute;z-index:2;display:grid;place-items:center;width:var(--cell);height:var(--cell);pointer-events:none;font-size:calc(var(--cell)*.5);filter:drop-shadow(0 2px 3px rgba(180,140,20,.4));animation:twinkle 1.8s ease-in-out infinite}
    @keyframes twinkle{50%{transform:scale(1.12)}}

    .unit{position:absolute;z-index:5;display:grid;place-items:center;width:var(--cell);height:var(--cell);border:0;background:transparent;
      cursor:pointer;transition:left .28s cubic-bezier(.4,1.3,.5,1),top .28s cubic-bezier(.4,1.3,.5,1)}
    .unit-body{position:relative;width:84%;height:84%;border:2px solid #fff;border-radius:13px;box-shadow:0 3px 6px rgba(45,33,70,.35)}
    .unit.friend .unit-body{background:linear-gradient(150deg,#b8e5ff,#6da9ef)}
    .unit.toy .unit-body{background:linear-gradient(150deg,#ffd1d7,#ec7c8b)}
    .unit img{position:absolute;inset:-12%;width:124%;height:124%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 1px rgba(52,41,75,.25))}
    .token-fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cell)*.5)}
    .unit.selected .unit-body{outline:3px solid #ffe36a;outline-offset:1px}
    .unit.reserved .unit-body{outline:3px solid var(--mint);outline-offset:1px}
    .unit.fixed{filter:grayscale(.35);opacity:.85}
    .unit.fixed .unit-body{background:linear-gradient(150deg,#cfeede,#8fd6b6)}
    .hearts{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);display:flex;gap:1px;z-index:6}
    .hearts i{width:8px;height:8px;border-radius:2px 2px 3px 3px;background:var(--coral);box-shadow:0 1px 1px rgba(0,0,0,.2)}
    .hearts i.lost{background:#c9c1d6}
    .gauge{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);display:none;gap:2px;z-index:6}
    .gauge i{width:7px;height:7px;border-radius:2px;background:#ffce3f;box-shadow:0 1px 1px rgba(0,0,0,.25)}
    .gauge i.spent{background:#cabfe0}
    .fixed-badge{position:absolute;top:-6px;right:-6px;z-index:7;display:none;width:19px;height:19px;place-items:center;border-radius:50%;background:var(--mint);color:#fff;font-size:12px;font-weight:900}
    .unit.fixed .fixed-badge{display:grid}
    .arrow{position:absolute;z-index:4;color:#c23a52;font-weight:950;font-size:calc(var(--cell)*.4);pointer-events:none;text-shadow:0 1px 2px #fff}
    .ghost{position:absolute;z-index:3;width:var(--cell);height:var(--cell);display:grid;place-items:center;pointer-events:none;opacity:.5}
    .ghost .ring{width:70%;height:70%;border:2px dashed #2f8e6c;border-radius:12px;background:rgba(79,189,152,.14)}
    .ghost.hit .ring{border-color:var(--coral);background:rgba(233,109,126,.16)}
    .float{position:absolute;z-index:20;font-size:calc(var(--cell)*.42);font-weight:950;pointer-events:none;animation:rise .8s ease-out forwards;text-shadow:0 2px #fff}
    @keyframes rise{to{transform:translateY(-26px);opacity:0}}

    .panel{flex:1 1 auto;min-height:150px;padding:9px 12px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
    .preview-line{min-height:22px;color:var(--violet-dark);font-size:12.5px;font-weight:800;margin-bottom:4px}
    .hint{min-height:30px;color:var(--muted);font-size:12px;line-height:1.4}
    .slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 8px}
    .slot{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:12px;background:#faf7ff;min-height:46px;cursor:pointer}
    .slot.set{border-color:var(--mint);background:#eefaf4}
    .slot .who{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:15px;background:#e9e3f7}
    .slot .desc{min-width:0;font-size:11.5px;line-height:1.3}
    .slot .desc b{display:block;font-size:12.5px}
    .slot .desc span{color:var(--muted)}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .actions .go{grid-column:1/-1;min-height:52px;font-size:16px}
    .actions .button{min-height:46px;padding:8px 6px;border-radius:12px;font-size:13px}

    /* 결과 */
    .result-screen{align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
      text-align:center;background:linear-gradient(155deg,#eee9ff,#fff9d9 58%,#dff6ec)}
    .result-art{width:min(200px,54vw);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 12px 18px rgba(74,54,109,.18))}
    .result-screen h1{margin:4px 0 2px;font-size:30px;letter-spacing:-.04em}
    .result-stars{margin:6px 0;color:var(--amber);font-size:40px;letter-spacing:3px;text-shadow:0 3px 0 #fff}
    .result-copy{max-width:330px;margin:0 auto 14px;color:var(--muted);line-height:1.55}
    .result-stats{display:flex;justify-content:center;gap:20px;margin:0 0 18px}
    .result-stats b{display:block;font-size:20px}
    .result-stats span{color:var(--muted);font-size:11px;font-weight:800}
    .result-actions{display:grid;gap:9px;width:min(330px,100%)}

    dialog{width:min(360px,calc(100% - 32px));max-height:calc(100dvh - 32px);overflow:auto;padding:0;border:0;border-radius:22px;color:var(--ink);background:var(--paper);box-shadow:0 20px 55px rgba(27,20,46,.4)}
    dialog::backdrop{background:rgba(28,21,47,.72)}
    .dialog-card{padding:22px}
    .dialog-card h2{margin:0 0 8px;font-size:22px}
    .dialog-card p{margin:0 0 16px;color:var(--muted);font-size:13.5px;line-height:1.6}
    .dialog-actions{display:grid;gap:9px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

    /* 밀기/당기기 아이콘 · 홈 범례 */
    .glyph{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:6px;color:#fff;font-size:13px;font-weight:900;line-height:1;vertical-align:middle}
    .glyph.push{background:var(--push)}
    .glyph.pull{background:var(--pull)}
    .legend{display:flex;gap:8px;margin-top:13px}
    .legend-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 5px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);font-size:12.5px;font-weight:800}
    .legend-chip .who{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:#f1ecfb}

    /* 목표 HUD — 남은 장난감을 그림으로 */
    .goal-hud{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px;font-weight:800}
    .goal-hud .toy-pip{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:8px;font-size:15px;
      background:#fff;border:1.5px solid #dfcc75;transition:transform .3s ease,background .3s ease,border-color .3s ease}
    .goal-hud .toy-pip.done{background:var(--mint);border-color:#2f8e6c;color:#fff;transform:scale(1.06)}
    .goal-hud .lbl{color:#7a6a2c}

    /* 슬롯(명령 상태를 아이콘으로) */
    .slot .desc b{display:flex;align-items:center;gap:4px}
    .slot .glyph{width:16px;height:16px;font-size:11px}
    .slot .slot-state{color:var(--muted)}
    .slot.set .slot-state{color:var(--ink);font-weight:800}
    .slot-mark{margin-left:auto;display:grid;place-items:center;width:26px;height:26px;font-size:17px;color:#c3bad6}
    .slot.latte.set{border-color:var(--push);background:#ebf2fd}
    .slot.mint.set{border-color:var(--pull);background:#e6f6f2}
    .slot.latte.set .slot-mark{color:var(--push)}
    .slot.mint.set .slot-mark{color:var(--pull)}
    .slot.sel{outline:2px solid #ffcf4a;outline-offset:1px}

    /* 조작 가능한 장난감이 스스로 빛난다(밀/당길 대상) */
    .unit.act-push .unit-body{animation:affpulse 1.05s ease-in-out infinite;box-shadow:0 3px 6px rgba(45,33,70,.35),0 0 0 3px var(--push),0 0 15px 3px rgba(63,134,230,.55)}
    .unit.act-pull .unit-body{animation:affpulse 1.05s ease-in-out infinite;box-shadow:0 3px 6px rgba(45,33,70,.35),0 0 0 3px var(--pull),0 0 15px 3px rgba(31,169,138,.55)}
    @keyframes affpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

    /* 방향 화살표(예고 미리보기 · 예약 확정) */
    .aff-arrow{position:absolute;z-index:8;display:grid;place-items:center;width:var(--cell);height:var(--cell);
      font-size:calc(var(--cell)*.52);font-weight:950;pointer-events:none;text-shadow:0 1px 2px #fff;animation:affbob .9s ease-in-out infinite}
    .aff-arrow.push{color:var(--push)}
    .aff-arrow.pull{color:var(--pull)}
    @keyframes affbob{50%{transform:scale(1.18)}}
    .cmd-arrow{position:absolute;z-index:8;display:grid;place-items:center;width:var(--cell);height:var(--cell);
      font-size:calc(var(--cell)*.46);font-weight:950;pointer-events:none;text-shadow:0 1px 2px #fff}
    .cmd-arrow.push{color:var(--push)}
    .cmd-arrow.pull{color:var(--pull)}
    .dest-mark{position:absolute;z-index:4;display:grid;place-items:center;width:var(--cell);height:var(--cell);pointer-events:none;font-size:calc(var(--cell)*.34);opacity:.85}
    .dest-mark .ring{position:absolute;inset:15%;border:2.5px dashed currentColor;border-radius:12px}
    .dest-mark.latte{color:var(--push)}
    .dest-mark.mint{color:var(--pull)}
    /* 밀/당길 수 있는 칸을 배지로 안내 */
    .act-badge{position:absolute;z-index:6;width:var(--cell);height:var(--cell);display:grid;justify-items:end;align-items:start;padding:3px;pointer-events:none}
    .act-badge i{display:grid;place-items:center;width:20px;height:20px;border-radius:7px;color:#fff;font-size:12px;font-weight:900;box-shadow:0 1px 3px rgba(0,0,0,.28);animation:affbob .9s ease-in-out infinite}
    .act-badge.pusher i{background:var(--push)}
    .act-badge.puller i{background:var(--pull)}
    /* 곧 광선을 쏠 포탑은 빨갛게 충전 */
    .unit.toy.charging .unit-body{animation:charge 1.1s ease-in-out infinite}
    @keyframes charge{0%,100%{box-shadow:0 3px 6px rgba(45,33,70,.35),0 0 0 2px rgba(224,75,97,.55)}50%{box-shadow:0 3px 6px rgba(45,33,70,.35),0 0 0 5px rgba(224,75,97,.85)}}
    /* 시작할 때 친구가 "날 눌러요" 하고 살짝 신호 */
    .unit.friend.invite .unit-body{animation:invitep 1.35s ease-in-out infinite}
    @keyframes invitep{0%,100%{box-shadow:0 3px 6px rgba(45,33,70,.35)}50%{box-shadow:0 3px 6px rgba(45,33,70,.35),0 0 0 5px rgba(120,102,216,.5)}}
    /* 출동 순간 광선이 실제로 발사되는 플래시 */
    .beam-flash{position:absolute;z-index:14;width:var(--cell);height:var(--cell);border-radius:6px;background:rgba(224,75,97,.55);animation:beamflash .42s ease-out forwards}
    @keyframes beamflash{from{opacity:.85;transform:scale(1)}to{opacity:0;transform:scale(1.05)}}

    /* 눌렀을 때 이펙트 */
    .ripple{position:absolute;z-index:15;width:var(--cell);height:var(--cell);border-radius:50%;pointer-events:none;
      background:radial-gradient(circle,rgba(120,102,216,.42),transparent 68%);animation:ripple .46s ease-out forwards}
    .ripple.go{background:radial-gradient(circle,rgba(63,134,230,.5),transparent 68%)}
    @keyframes ripple{from{transform:scale(.35);opacity:.95}to{transform:scale(1.9);opacity:0}}
    .spark{position:absolute;z-index:22;pointer-events:none;font-size:calc(var(--cell)*.36);animation:spark .72s ease-out forwards}
    @keyframes spark{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
    .unit.pop-fx{animation:popfx .3s ease}
    @keyframes popfx{40%{transform:scale(1.18)}}
    .unit.repaired-fx .unit-body{animation:repairflash .62s ease-out}
    @keyframes repairflash{0%{box-shadow:0 0 0 0 rgba(79,189,152,.85)}100%{box-shadow:0 0 0 24px rgba(79,189,152,0)}}
    .unit.hurt-fx{animation:shakefx .42s}
    .unit.hurt-fx .unit-body{animation:hurtflash .42s}
    @keyframes shakefx{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
    @keyframes hurtflash{0%,100%{filter:none}45%{filter:brightness(1.3) drop-shadow(0 0 6px var(--coral))}}

    /* 노는 방법 — 그림 가이드 */
    .how-visual{display:grid;gap:15px}
    .how-step{display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:center}
    .mini{display:grid;gap:2px;padding:3px;border-radius:10px;background:#cfc5df;box-shadow:0 4px 10px rgba(62,46,92,.16)}
    .mini .mc{position:relative;width:27px;height:27px;border-radius:5px;background:var(--floor-a);display:grid;place-items:center;font-size:16px;line-height:1}
    .mini .mc.alt{background:var(--floor-b)}
    .mini .mc.wall{background:linear-gradient(145deg,#a597be,#81739f)}
    .mini .mc .ar{font-weight:950;font-size:15px}
    .mini .mc .ar.push{color:var(--push)}
    .mini .mc .ar.pull{color:var(--pull)}
    .mini .mc .ar.foe{color:#c23a52}
    .mini .mc.hot{box-shadow:inset 0 0 0 2px rgba(224,75,97,.55)}
    .how-cap{font-size:13px;line-height:1.5;color:var(--ink)}
    .how-cap b{color:var(--violet-dark)}
    .how-legend{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 4px}
    .how-legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
    .how-legend .sw{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:11px;color:#fff}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="app" id="app">
    <section class="screen active" id="homeScreen" aria-labelledby="gameTitle">
      <header class="home-hero">
        <div class="brand-row">
          <span class="pill">⭐ 별빛 구조 퍼즐</span>
          <button class="icon-button" id="homeSound" type="button" aria-label="소리 켜기 또는 끄기">🔊</button>
        </div>
        <div class="hero-spacer"></div>
        <p class="brand-kicker">MALLANG FRIENDS</p>
        <h1 class="brand-title" id="gameTitle">별빛작전</h1>
        <p class="brand-sub">고장 난 장난감을 밀고 당겨 모두 수리해요.</p>
        <div class="legend" aria-hidden="true">
          <span class="legend-chip latte"><span class="who">🐶</span><i class="glyph push">»</i>밀기</span>
          <span class="legend-chip mint"><span class="who">🐱</span><i class="glyph pull">«</i>당기기</span>
        </div>
      </header>
      <div class="home-body">
        <div class="section-title"><h2>퍼즐</h2><small id="progress">0 / 5 완료</small></div>
        <div class="puzzle-list" id="puzzleList" aria-label="퍼즐 목록"></div>
        <div class="continue-area">
          <button class="button" id="continueButton" type="button">첫 퍼즐 시작</button>
          <button class="button secondary" id="howButton" type="button">노는 방법</button>
        </div>
      </div>
    </section>

    <section class="screen battle-screen" id="battleScreen" aria-label="퍼즐">
      <header class="battle-bar">
        <button class="icon-button" id="battleMenu" type="button" aria-label="메뉴">☰</button>
        <div class="battle-heading"><b id="battleTitle">퍼즐</b><span id="battleLocation"></span></div>
        <div class="beat-badge"><b id="beatText">1비트</b><small id="parText">최적 1</small></div>
      </header>
      <div class="goal-bar"><span class="obj" aria-hidden="true">🔧</span><span id="goalText" class="goal-hud" aria-live="polite"></span></div>
      <div class="board-scroll"><div class="board" id="board" role="grid" aria-label="퍼즐 보드"></div></div>
      <section class="panel" aria-label="명령 패널">
        <div class="preview-line" id="previewLine" aria-live="polite"></div>
        <div class="hint" id="hint" aria-live="polite"></div>
        <div class="slots">
          <button class="slot latte" id="slotLatte" type="button">
            <span class="who">🐶</span>
            <span class="desc"><b>라떼 <i class="glyph push" aria-hidden="true">»</i></b><span class="slot-state">대기</span></span>
            <span class="slot-mark" aria-hidden="true"></span>
          </button>
          <button class="slot mint" id="slotMint" type="button">
            <span class="who">🐱</span>
            <span class="desc"><b>민트 <i class="glyph pull" aria-hidden="true">«</i></b><span class="slot-state">대기</span></span>
            <span class="slot-mark" aria-hidden="true"></span>
          </button>
        </div>
        <div class="actions">
          <button class="button secondary" id="btnUndo" type="button">되돌리기</button>
          <button class="button secondary" id="btnRestart" type="button">처음부터</button>
          <button class="button go" id="btnGo" type="button">출동!</button>
        </div>
      </section>
    </section>

    <section class="screen result-screen" id="resultScreen" aria-labelledby="resultTitle">
      <img class="result-art" src="./assets/runtime/ui/result-sticker.webp" alt="별 스티커를 든 말랑프렌즈">
      <span class="pill" id="resultEyebrow">결과</span>
      <h1 id="resultTitle">수리 완료!</h1>
      <div class="result-stars" id="resultStars" aria-label="별 3개">★★★</div>
      <p class="result-copy" id="resultCopy"></p>
      <div class="result-stats"><div><b id="resultBeats">0</b><span>사용 비트</span></div><div><b id="resultDamage">0</b><span>받은 피해</span></div></div>
      <div class="result-actions">
        <button class="button" id="resultNext" type="button">다음 퍼즐</button>
        <button class="button secondary" id="resultRetry" type="button">다시 도전</button>
        <button class="button secondary" id="resultHome" type="button">퍼즐 목록</button>
      </div>
    </section>
  </main>

  <dialog id="menuDialog">
    <div class="dialog-card">
      <h2>잠깐 쉴까요?</h2>
      <p>같은 퍼즐을 언제든 다시 도전할 수 있어요.</p>
      <div class="dialog-actions">
        <button class="button" id="menuContinue" type="button">계속하기</button>
        <button class="button secondary" id="menuHow" type="button">노는 방법</button>
        <button class="button danger" id="menuQuit" type="button">퍼즐 목록으로</button>
      </div>
    </div>
  </dialog>

  <dialog id="howDialog">
    <div class="dialog-card">
      <h2>노는 방법</h2>
      <div id="howText"></div>
      <button class="button" id="howClose" type="button" style="margin-top:16px">알겠어요</button>
    </div>
  </dialog>

  <div class="sr-only" id="announcer" aria-live="assertive"></div>
  <script src="../../games/registry.js"></script>
  <script src="../../shared/bootstrap.js"></script>
  <script src="./data/puzzles.js"></script>
  <script src="./engine/puzzle.js"></script>
  <script src="./engine/ui.js"></script>
</body>
</html>
