<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>말랑프렌즈 광장 — 말랑프렌즈 아케이드</title>
  <meta name="description" content="말랑한 친구들과 모여 미니게임을 즐기는 광장." />
  <meta name="theme-color" content="#4b6bff" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/games/jump-climber/assets/icon.svg" type="image/svg+xml" />
  <meta property="og:title" content="말랑프렌즈 광장" />
  <meta property="og:description" content="말랑한 친구들과 모여 미니게임을 즐기는 광장." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <!-- Lobby (pre-join) -->
    <section id="join-panel" class="panel">
      <h1>말랑프렌즈 광장</h1>
      <p class="subtitle">캐릭터를 골라서 광장에 입장하세요.</p>
      <p id="online-count" class="online-count" aria-live="polite"></p>

      <label class="field">
        <span>닉네임</span>
        <input id="name-input" type="text" maxlength="16" autocomplete="off" placeholder="최대 16자" />
      </label>

      <fieldset class="field">
        <legend>캐릭터</legend>
        <div id="character-picker" class="character-picker"></div>
      </fieldset>

      <button id="join-btn" type="button" disabled>광장 입장</button>
      <p id="join-status" class="status"></p>

      <p class="extra-links">
        <a href="/leaderboard/" target="_blank" rel="noopener">🏆 주간 리더보드 보기</a>
      </p>
    </section>

    <!-- Auto-enter splash — 게임에서 광장으로 복귀(from=game) 했을 때 picker
         가 잠깐 보이는 깜빡임 없이 "광장 입장 중…" 안내만 표시. WS welcome
         도착하면 worldPanel 로 교체. WS 실패하면 showJoinError 가 picker 로 복귀. -->
    <section id="auto-enter-splash" class="auto-enter-splash hidden" aria-live="polite">
      <div class="auto-enter-splash__inner">
        <div class="auto-enter-splash__spinner" aria-hidden="true"></div>
        <p class="auto-enter-splash__text">광장에 들어가는 중…</p>
      </div>
    </section>

    <!-- World (post-join) -->
    <section id="world-panel" class="panel hidden">
      <header class="world-header">
        <div class="brand">
          <img id="brand-logo" class="brand-logo" src="./assets/logo_mallang.png" alt=""
               onerror="this.style.display='none'" />
          <span class="brand-title">말랑프렌즈 아케이드</span>
        </div>
        <div class="world-meta">
          <button id="leave-btn" type="button" class="leave-btn" title="캐릭터 다시 고르기">← 캐릭터 변경</button>
          <span id="conn-status" class="conn ok">연결됨</span>
        </div>
      </header>
      <div class="canvas-wrap">
        <canvas id="world-canvas" width="960" height="960"></canvas>
      </div>

      <div id="chat-log" class="chat-log">
        <div class="chat-log-header">
          <span class="chat-log-title">채팅</span>
          <button id="chat-log-toggle" type="button" class="chat-log-toggle" aria-label="채팅 접기" aria-expanded="true">⌄</button>
        </div>
        <div id="chat-log-body" class="chat-log-body" aria-live="polite"></div>
      </div>

      <div class="reactions" id="reaction-bar"></div>

      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" type="text" maxlength="120" placeholder="메시지를 입력하고 Enter" />
        <button type="submit">전송</button>
      </form>

    </section>

    <!-- 배포 버전 인디케이터 — 새 deploy 반영 여부 즉시 확인용. SW CACHE
         버전과 시각을 동기화해서 사용자가 한눈에 stale 캐시인지 알 수 있다. -->
    <div id="app-version" class="app-version" aria-hidden="true">v28</div>

    <div id="match-modal" class="modal hidden" aria-hidden="true" role="dialog">
      <div class="modal-card" id="match-modal-card">
        <button id="match-preview-toggle" type="button" class="preview-toggle hidden" aria-expanded="false">게임 미리보기 ▸</button>
        <img id="match-preview" class="match-preview hidden" alt="" />
        <h2 id="match-title">매칭 확인</h2>
        <p id="match-status" class="modal-sub"></p>
        <ul id="match-members" class="match-members"></ul>
        <div class="modal-actions" id="match-actions">
          <button id="match-decline" type="button" class="btn-ghost">나가기</button>
          <button id="match-accept" type="button" class="btn-primary">시작</button>
        </div>
        <!-- match_starting 도착 시 위 요소들이 숨겨지고 아래 전환 화면이 표시됨.
             handleMatchStarting/closeMatchModal 에서 aria-hidden 을 토글한다. -->
        <div id="match-starting-view" class="match-starting-view" aria-hidden="true" role="status" aria-live="polite">
          <div class="starter-portrait" id="starter-portrait" aria-hidden="true"></div>
          <div class="starter-text" id="starter-text"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/shared/config.js"></script>
  <script src="/shared/character_sprites.js"></script>
  <script src="/shared/input.js"></script>
  <script src="./world.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
