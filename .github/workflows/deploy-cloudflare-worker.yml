name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run worker tests
        run: npm test

      - name: Run D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 각 파일은 CREATE TABLE/INDEX IF NOT EXISTS 라 매 푸시 재실행해도 idempotent.
        # 새 마이그레이션 추가 시 아래에 한 줄씩 덧붙인다.
        run: |
          npx wrangler d1 execute web-game-lab-scores --remote --file=migrations/0001_create_scores.sql
          npx wrangler d1 execute web-game-lab-scores --remote --file=migrations/0002_create_world_logs.sql
          npx wrangler d1 execute web-game-lab-scores --remote --file=migrations/0003_create_runner_telemetry.sql

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml
