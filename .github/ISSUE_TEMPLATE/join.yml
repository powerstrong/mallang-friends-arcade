name: 참여 문의 / 자기소개
description: 말랑프렌즈 아케이드에 같이 참여하고 싶다면 여기로 인사해 주세요!
title: "[참여] "
labels: ["참여문의"]
body:
  - type: markdown
    attributes:
      value: |
        환영합니다! 🎉 같이 주말마다 미니게임을 만들어볼 분을 찾고 있어요.
        아래 몇 가지만 적어주시면 관리자가 확인하고 답을 드립니다. (부담 없이 가볍게!)

  - type: input
    id: nickname
    attributes:
      label: 닉네임 / 부르는 이름
      description: 어떻게 부르면 될까요? (선택)
      placeholder: 예) 말랑러버, 토끼개발자
    validations:
      required: false

  - type: dropdown
    id: interest
    attributes:
      label: 무엇을 해보고 싶나요?
      options:
        - 새 게임 만들기
        - 기존 게임 개선 (예- 퀴즈 재미 개선)
        - 버그 수정
        - 일단 구경 & 아이디어 제안
        - 기타 (아래에 적어 주세요)
    validations:
      required: true

  - type: dropdown
    id: level
    attributes:
      label: 개발 경험
      description: 편하게 골라 주세요. 초보·취미 환영입니다.
      options:
        - 코딩 처음 / 입문
        - 취미로 해봄
        - 주니어 개발자
        - 경력 개발자
        - AI 툴 위주로 만듦
    validations:
      required: true

  - type: checkboxes
    id: ai-tools
    attributes:
      label: 사용하는 AI 코딩 도구 (복수 선택 가능)
      options:
        - label: Claude Code
        - label: Codex
        - label: Cursor
        - label: 기타
        - label: 아직 안 씀 / 잘 모름

  - type: textarea
    id: message
    attributes:
      label: 만들고 싶은 게임이나 하고 싶은 말
      description: 자유롭게 적어 주세요. (선택)
      placeholder: 예) 간단한 반응속도 대결 게임을 만들어보고 싶어요!
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        먼저 둘러보면 좋은 문서:
        [README](../../blob/main/README.md) · [기여 가이드](../../blob/main/CONTRIBUTING.md) · [게임 추가 매뉴얼](../../blob/main/docs/ADD_GAME.md)
